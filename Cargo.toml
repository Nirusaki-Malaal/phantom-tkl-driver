[workspace]
members = [
    "crates/phantom-core",
]

[package]
name = "phantom-studio"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Native control studio for the Phantom TKL keyboard"
license = "GPL-3.0-or-later"

[dependencies]
phantom-core = { path = "crates/phantom-core" }
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13.2", default-features = false }
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = { version = "2.6", default-features = false }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
