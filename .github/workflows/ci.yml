name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  build:
    name: Bundle (${{ matrix.platform }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libudev-dev pkg-config
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install gtk4 pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build native release
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$BUILD_TARGET"
      - name: Package and smoke-test extracted executable
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python3 tools/package_release.py --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-studio-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
